<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Riepilogo Cassa - ProLoco Mappano</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Blocca zoom e refresh accidentali per un'esperienza "app-like" fluida */
        * { user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    </style>
</head>
<body class="bg-slate-900 h-screen w-screen overflow-hidden flex flex-col p-4 gap-4 font-sans text-slate-100">

    <!-- 1. INCASSO TOTALE (Ancora più grosso e in alto) -->
    <div class="flex-[1.5] bg-slate-800 rounded-3xl border-2 border-slate-700 shadow-2xl flex flex-col items-center justify-center">
        <span class="text-slate-400 text-sm md:text-base font-bold uppercase tracking-[0.2em] mb-2">Incasso Totale</span>
        
        <!-- L'ID serve per spararci dentro il valore con il JS -->
        <div id="totale-generale" class="text-7xl sm:text-8xl font-black text-green-400 tracking-tighter drop-shadow-lg">
            €0,00
        </div>
    </div>

    <!-- 2. I TRE METODI DI PAGAMENTO (Impilati e proporzionati) -->
    <div class="flex-[2] flex flex-col gap-3">
        
        <!-- Contanti -->
        <div class="flex-1 bg-emerald-600 rounded-2xl shadow-lg border border-emerald-500 flex items-center justify-between px-6 sm:px-10">
            <div class="flex items-center gap-4">
                <span class="text-4xl drop-shadow-md">💵</span>
                <span class="font-bold text-xl sm:text-2xl tracking-wide">Contanti</span>
            </div>
            <div id="totale-contanti" class="text-3xl sm:text-4xl font-black drop-shadow-md">
                €0,00
            </div>
        </div>

        <!-- Satispay -->
        <div class="flex-1 bg-red-600 rounded-2xl shadow-lg border border-red-500 flex items-center justify-between px-6 sm:px-10">
            <div class="flex items-center gap-4">
                <span class="text-4xl drop-shadow-md">📲</span>
                <span class="font-bold text-xl sm:text-2xl tracking-wide">Satispay</span>
            </div>
            <div id="totale-satispay" class="text-3xl sm:text-4xl font-black drop-shadow-md">
                €0,00
            </div>
        </div>

        <!-- SumUp (Azzurro) -->
        <div class="flex-1 bg-sky-500 rounded-2xl shadow-lg border border-sky-400 flex items-center justify-between px-6 sm:px-10">
            <div class="flex items-center gap-4">
                <span class="text-4xl drop-shadow-md">💳</span>
                <span class="font-bold text-xl sm:text-2xl tracking-wide">SumUp</span>
            </div>
            <div id="totale-sumup" class="text-3xl sm:text-4xl font-black drop-shadow-md">
                €0,00
            </div>
        </div>

    </div>

</body>
</html>
