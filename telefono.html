<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cassa Telefono - ProLoco Mappano</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Qui ci andranno poi i tuoi script di Firebase -->
    
    <style>
        /* Disabilita zoom e selezioni accidentali mentre si usa la cassa rapidamente */
        * { user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    </style>
</head>
<body class="bg-slate-900 min-h-screen flex flex-col text-slate-100 font-sans overflow-hidden">

    <!-- Header minimale -->
    <header class="p-4 flex items-center justify-between border-b border-slate-800">
        <div class="font-black tracking-widest text-slate-300">CASSA MAPPANO</div>
        <div class="text-xs bg-red-600 text-white font-bold px-2 py-1 rounded animate-pulse">LIVE</div>
    </header>

    <!-- Sezione Totale (Gigante e centrata) -->
    <main class="flex-1 flex flex-col justify-center items-center p-4">
        <span class="text-slate-400 text-sm md:text-base font-bold uppercase tracking-[0.2em] mb-4">Totale Acquistato</span>
        
        <!-- Contenitore del numero. Le classi text-7xl/8xl lo rendono enorme -->
        <div id="totale-display" class="text-7xl sm:text-8xl font-black text-green-400 tracking-tighter drop-shadow-lg">
            €0,00
        </div>
    </main>

    <!-- Sezione Bottoni Pagamento (3 riquadri identici) -->
    <footer class="w-full max-w-md mx-auto p-4 mb-4">
        <div class="grid grid-cols-3 gap-3">
            
            <!-- Contanti -->
            <button id="btn-contanti" class="bg-emerald-600 hover:bg-emerald-500 active:scale-95 transition-transform h-32 rounded-2xl flex flex-col items-center justify-center shadow-lg border border-emerald-500">
                <span class="text-3xl sm:text-4xl mb-2 drop-shadow-md">💵</span>
                <span class="font-bold text-sm sm:text-base">Contanti</span>
            </button>

            <!-- Satispay -->
            <button id="btn-satispay" class="bg-red-600 hover:bg-red-500 active:scale-95 transition-transform h-32 rounded-2xl flex flex-col items-center justify-center shadow-lg border border-red-500">
                <span class="text-3xl sm:text-4xl mb-2 drop-shadow-md">📲</span>
                <span class="font-bold text-sm sm:text-base">Satispay</span>
            </button>

            <!-- SumUp -->
            <button id="btn-sumup" class="bg-blue-600 hover:bg-blue-500 active:scale-95 transition-transform h-32 rounded-2xl flex flex-col items-center justify-center shadow-lg border border-blue-500">
                <span class="text-3xl sm:text-4xl mb-2 drop-shadow-md">💳</span>
                <span class="font-bold text-sm sm:text-base">SumUp</span>
            </button>

        </div>
    </footer>

</body>
</html>
