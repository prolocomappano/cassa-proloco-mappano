<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Riepilogo Cassa - ProLoco Mappano</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SDK Firebase per database in tempo reale -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        /* Blocca zoom e refresh accidentali per un'esperienza fluida */
        * { user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    </style>
</head>
<body class="bg-slate-100 h-screen w-screen overflow-hidden flex flex-col p-4 gap-4 font-sans text-slate-800">

    <!-- Freccia per tornare alla Home (index.html) -->
    <div class="flex justify-start">
        <a href="index.html" class="flex items-center gap-2 text-slate-500 hover:text-slate-800 active:scale-95 transition-all w-fit bg-white px-4 py-2 rounded-full border border-slate-200 shadow-sm">
            <span class="text-xl leading-none">←</span>
            <span class="font-bold text-sm tracking-wide uppercase">Home</span>
        </a>
    </div>

    <!-- 1. INCASSO TOTALE -->
    <div class="flex-[1.5] bg-white rounded-3xl border border-slate-200 shadow-lg flex flex-col items-center justify-center">
        <span class="text-slate-400 text-sm md:text-base font-bold uppercase tracking-[0.2em] mb-2">Incasso Totale</span>
        <div id="totale-generale" class="text-7xl sm:text-8xl font-black text-emerald-600 tracking-tighter drop-shadow-sm">
            €0,00
        </div>
    </div>

    <!-- 2. I TRE METODI DI PAGAMENTO -->
    <div class="flex-[2] flex flex-col gap-3 pb-2">
        
        <!-- Contanti -->
        <div class="flex-1 bg-white rounded-2xl shadow-md border border-slate-200 flex items-center justify-between px-6 sm:px-10">
            <div class="flex items-center gap-4">
                <span class="text-4xl drop-shadow-sm">💵</span>
                <span class="font-bold text-xl sm:text-2xl tracking-wide text-slate-700">Contanti</span>
            </div>
            <div id="totale-contanti" class="text-3xl sm:text-4xl font-black text-emerald-700 drop-shadow-sm">
                €0,00
            </div>
        </div>

        <!-- Satispay -->
        <div class="flex-1 bg-white rounded-2xl shadow-md border border-slate-200 flex items-center justify-between px-6 sm:px-10">
            <div class="flex items-center gap-4">
                <span class="text-4xl drop-shadow-sm">📲</span>
                <span class="font-bold text-xl sm:text-2xl tracking-wide text-slate-700">Satispay</span>
            </div>
            <div id="totale-satispay" class="text-3xl sm:text-4xl font-black text-red-600 drop-shadow-sm">
                €0,00
            </div>
        </div>

        <!-- SumUp -->
        <div class="flex-1 bg-white rounded-2xl shadow-md border border-slate-200 flex items-center justify-between px-6 sm:px-10">
            <div class="flex items-center gap-4">
                <span class="text-4xl drop-shadow-sm">💳</span>
                <span class="font-bold text-xl sm:text-2xl tracking-wide text-slate-700">SumUp</span>
            </div>
            <div id="totale-sumup" class="text-3xl sm:text-4xl font-black text-slate-900 drop-shadow-sm">
                €0,00
            </div>
        </div>

    </div>

    <!-- SCRIPT FIREBASE: Sincronizzazione in tempo reale -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAcY_m9YLQUPuB2ueMFnrBEg8q4NXgYxgU",
            authDomain: "cassa-proloco-mappano.firebaseapp.com",
            databaseURL: "https://cassa-proloco-mappano-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "cassa-proloco-mappano",
            storageBucket: "cassa-proloco-mappano.firebasestorage.app",
            messagingSenderId: "492706816408",
            appId: "1:492706816408:web:6c0f4533ff78d94106cbed",
            measurementId: "G-07KT9FBQLC"
        };

        // Inizializza Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Mettiti in ascolto delle modifiche sul database (nodo 'incassi')
        db.ref('incassi').on('value', (snapshot) => {
            const data = snapshot.val() || {};
            
            // Assicurati che i valori siano numeri, sennò imposta 0
            const contanti = parseFloat(data.contanti) || 0;
            const satispay = parseFloat(data.satispay) || 0;
            const sumup = parseFloat(data.sumup) || 0;
            const totale = contanti + satispay + sumup;

            // Aggiorna gli elementi HTML formattando con i decimali
            document.getElementById('totale-generale').innerText = '€' + totale.toFixed(2).replace('.', ',');
            document.getElementById('totale-contanti').innerText = '€' + contanti.toFixed(2).replace('.', ',');
            document.getElementById('totale-satispay').innerText = '€' + satispay.toFixed(2).replace('.', ',');
            document.getElementById('totale-sumup').innerText = '€' + sumup.toFixed(2).replace('.', ',');
        });
    </script>
</body>
</html>
