<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cassa Telefono - ProLoco Mappano</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.x.x/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.x.x/firebase-database-compat.js"></script>
    <style>
        * { user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans p-4">

    <!-- Header -->
    <header class="flex items-center justify-between pb-4 mb-4 border-b border-slate-700">
        <div class="flex font-black tracking-wide text-white text-xl">LIVE INCASSI</div>
        <div class="text-sm text-slate-400">Pro Loco Mappano</div>
    </header>

    <!-- Sezione Totale -->
    <main class="flex-1 flex flex-col justify-center items-center my-6">
        <span class="text-slate-400 text-sm font-semibold uppercase tracking-wider mb-2">Totale Incasso</span>
        <div id="totale-display" class="text-5xl font-extrabold text-green-400">€0,00</div>
    </main>

    <!-- Bottoni di Pagamento (Contanti, Satispay, SumUp) -->
    <!-- 'grid grid-cols-3 gap-3' forza tutti e tre i bottoni ad avere la stessa larghezza ed altezza -->
    <footer class="grid grid-cols-3 gap-3 w-full max-w-md mx-auto pt-4 border-t border-slate-700">
        
        <button id="btn-contanti" class="bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-bold py-4 px-2 rounded-xl flex flex-col items-center justify-center shadow-lg transition-all text-center">
            <span class="text-2xl mb-1">💵</span>
            <span class="text-sm sm:text-base">Contanti</span>
        </button>

        <button id="btn-satispay" class="bg-red-600 hover:bg-red-500 active:scale-95 text-white font-bold py-4 px-2 rounded-xl flex flex-col items-center justify-center shadow-lg transition-all text-center">
            <span class="text-2xl mb-1">📲</span>
            <span class="text-sm sm:text-base">Satispay</span>
        </button>

        <button id="btn-sumup" class="bg-blue-600 hover:bg-blue-500 active:scale-95 text-white font-bold py-4 px-2 rounded-xl flex flex-col items-center justify-center shadow-lg transition-all text-center">
            <span class="text-2xl mb-1">💳</span>
            <span class="text-sm sm:text-base">SumUp</span>
        </button>

    </footer>

</body>
</html>
