<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Riepilogo Cassa - ProLoco Mappano</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SDK Firebase per database in tempo reale -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        /* Blocca zoom e refresh accidentali per un'esperienza fluida */
        * { user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    </style>
</head>
<body class="bg-slate-900 h-screen w-screen overflow-hidden flex flex-col p-4 gap-4 font-sans text-slate-100">

    <!-- Freccia per tornare alla Home (index.html) -->
    <div class="flex justify-start">
        <a href="index.html" class="flex items-center gap-2 text-slate-400 hover:text-white active:scale-95 transition-all w-fit bg-slate-800 px-4 py-2 rounded-full border border-slate-700 shadow-md">
            <span class="text-xl leading-none">←</span>
            <span class="font-bold text-sm tracking-wide uppercase">Home</span>
        </a>
    </div>

    <!-- 1. INCASSO TOTALE -->
    <div class="flex-[1.5] bg-slate-800 rounded-3xl border-2 border-slate-700 shadow-2xl flex flex-col items-center justify-center">
        <span class="text-slate-400 text-sm md:text-base font-bold uppercase tracking-[0.2em] mb-2">Incasso Totale</span>
        <div id="totale-generale" class="text-7xl sm:text-8xl font-black text-green-400 tracking-tighter drop-shadow-lg">
            €0,00
        </div>
    </div>

    <!-- 2. I TRE METODI DI PAGAMENTO -->
    <div class="flex-[2] flex flex-col gap-3 pb-2">
        
        <!-- Contanti -->
        <div class="flex-1 bg-emerald-600 rounded-2xl shadow-lg border border-emerald-500 flex items-center justify-between px-6 sm:px-10">
            <div class="flex items-center gap-4">
                <span class="text-4xl drop-shadow-md">💵</span>
                <span class="font-bold text-xl sm:text-2xl tracking-wide">Contanti</span>
            </div>
            <div id="totale-contanti" class="text-3xl sm:text-4xl font-black drop-shadow-md">
                €0,00
            </div>
        </div>

        <!-- Satispay -->
        <div class="flex-1 bg-red-600 rounded-2xl shadow-lg border border-red-500 flex items-center justify-between px-6 sm:px-10">
            <div class="flex items-center gap-4">
                <span class="text-4xl drop-shadow-md">📲</span>
                <span class="font-bold text-xl sm:text-2xl tracking-wide">Satispay</span>
            </div>
            <div id="totale-satispay" class="text-3xl sm:text-4xl font-black drop-shadow-md">
                €0,00
            </div>
        </div>

        <!-- SumUp -->
        <div class="flex-1 bg-sky-500 rounded-2xl shadow-lg border border-sky-400 flex items-center justify-between px-6 sm:px-10">
            <div class="flex items-center gap-4">
                <span class="text-4xl drop-shadow-md">💳</span>
                <span class="font-bold text-xl sm:text-2xl tracking-wide">SumUp</span>
            </div>
            <div id="totale-sumup" class="text-3xl sm:text-4xl font-black drop-shadow-md">
                €0,00
            </div>
        </div>

    </div>

    <!-- SCRIPT FIREBASE: Sincronizzazione in tempo reale -->
    <script>
        // SOSTITUISCI QUESTI VALORI CON LE CREDENZIALI DEL TUO PROGETTO FIREBASE
        const firebaseConfig = {
            apiKey: "LA_TUA_API_KEY",
            authDomain: "IL_TUO_PROGETTO.firebaseapp.com",
            databaseURL: "https://IL_TUO_PROGETTO-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "IL_TUO_PROGETTO",
            storageBucket: "IL_TUO_PROGETTO.appspot.com",
            messagingSenderId: "IL_TUO_SENDER_ID",
            appId: "IL_TUO_APP_ID"
        };

        // Inizializza Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Mettiti in ascolto delle modifiche sul database (nodo 'incassi')
        db.ref('incassi').on('value', (snapshot) => {
            const data = snapshot.val() || {};
            
            // Assicurati che i valori siano numeri, sennò imposta 0
            const contanti = parseFloat(data.contanti) || 0;
            const satispay = parseFloat(data.satispay) || 0;
            const sumup = parseFloat(data.sumup) || 0;
            const totale = contanti + satispay + sumup;

            // Aggiorna gli elementi HTML formattando con i decimali
            document.getElementById('totale-generale').innerText = '€' + totale.toFixed(2).replace('.', ',');
            document.getElementById('totale-contanti').innerText = '€' + contanti.toFixed(2).replace('.', ',');
            document.getElementById('totale-satispay').innerText = '€' + satispay.toFixed(2).replace('.', ',');
            document.getElementById('totale-sumup').innerText = '€' + sumup.toFixed(2).replace('.', ',');
        });
    </script>
</body>
</html>
